[package]
name = "shunkashuto"
version = "1.0.0"
edition = "2021"
rust-version = "1.80"
description = "春・夏・秋・冬 —— Junia Brutus / 重音テト 终端 MV：实时 TUI 播放 + 离线 MP4 导出"
license = "MIT"

[[bin]]
name = "shunkashuto"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
tachyonfx = "0.21"
rodio = "0.20"
realfft = "3"
rustfft = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
hound = "3"
image = "0.25"
fontdue = "0.9"
parking_lot = "0.12"
crossbeam-channel = "0.5"
rand = { version = "0.8", features = ["small_rng"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
